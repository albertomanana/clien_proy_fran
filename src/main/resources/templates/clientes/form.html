<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${cliente.id == 0 ? 'Nuevo Cliente' : 'Editar Cliente'}">Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-title: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .main-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 3rem;
            margin-top: 3rem;
            max-width: 750px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            margin-top: 2.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .section-title i {
            font-size: 1.1rem;
        }

        .form-control {
            background-color: #ffffff;
            color: var(--text-title);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            font-size: 0.95rem;
            transition: all 0.2s;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .form-control:focus {
            background-color: #ffffff;
            color: var(--text-title);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            border-color: var(--primary-color);
            outline: none;
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 0.4rem;
        }

        .preview-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--bg-light);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .btn-custom {
            border-radius: 10px;
            font-weight: 500;
            padding: 0.6rem 1.5rem;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-save {
            background-color: var(--primary-color);
            border: none;
            color: #ffffff;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        .btn-save:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.3);
        }

        .economic-box {
            background-color: var(--bg-light);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .btn-light-custom {
            background-color: #ffffff;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .btn-light-custom:hover {
            background-color: var(--bg-light);
            color: var(--text-title);
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: var(--text-muted);
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-icon:hover {
            background-color: var(--bg-light);
            color: var(--text-title);
        }

        h2 {
            color: var(--text-title);
        }

        .text-primary {
            color: var(--primary-color) !important;
        }

        .border-primary {
            border-color: var(--primary-color) !important;
        }
    </style>
</head>

<body class="container pb-5">
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="fw-bold mb-0" th:text="${cliente.id == 0 ? 'Nuevo Cliente' : 'Editar Cliente'}">Cliente</h2>
            <a th:href="@{/clientes}" class="btn-icon" title="Cerrar">
                <i class="ph ph-x fs-5"></i>
            </a>
        </div>
        <p class="text-muted mb-4 pb-3 border-bottom"
            th:text="${cliente.id == 0 ? 'Añade los detalles del nuevo cliente en el sistema.' : 'Actualiza la información del cliente.'}">
        </p>

        <form th:action="${cliente.id == 0 ? '/clientes/guardar' : '/clientes/actualizar'}" th:object="${cliente}"
            method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}" />

            <!-- Datos -->
            <div class="section-title"><i class="ph ph-user"></i> Datos Personales</div>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej. Juan" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Apellidos</label>
                    <input type="text" th:field="*{apellidos}" class="form-control" placeholder="Ej. Pérez" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="juan@ejemplo.com"
                        required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input type="text" th:field="*{telefono}" class="form-control" placeholder="+34 600 000 000">
                </div>
                <div class="col-12">
                    <label class="form-label">Dirección</label>
                    <input type="text" th:field="*{direccion}" class="form-control" placeholder="Calle Ejemplo, 123">
                </div>
            </div>

            <!-- Pagos -->
            <div class="section-title"><i class="ph ph-currency-circle-dollar"></i> Registro de Pagos</div>
            <div class="economic-box">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label d-block text-center">1er Pago</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">€</span>
                            <input type="number" step="0.01" th:field="*{pago1}"
                                class="form-control border-start-0 ps-0">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label d-block text-center">2do Pago</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">€</span>
                            <input type="number" step="0.01" th:field="*{pago2}"
                                class="form-control border-start-0 ps-0">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label d-block text-center">3er Pago</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted">€</span>
                            <input type="number" step="0.01" th:field="*{pago3}"
                                class="form-control border-start-0 ps-0">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label d-block text-center text-primary">Final</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-primary border-primary">€</span>
                            <input type="number" step="0.01" th:field="*{pagoFinal}"
                                class="form-control border-start-0 ps-0 border-primary fw-medium text-primary">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Foto -->
            <div class="section-title"><i class="ph ph-image"></i> Fotografía del Cliente</div>
            <div class="row align-items-center g-4">
                <div class="col-auto position-relative">
                    <img id="preview"
                        th:src="${cliente.fotoPath != null && !cliente.fotoPath.isEmpty() ? '/' + cliente.fotoPath : 'https://ui-avatars.com/api/?name=Foto&background=e2e8f0&color=475569'}"
                        class="preview-img" alt="Vista previa">

                    <!-- Botón para eliminar foto -->
                    <a th:if="${cliente.fotoPath != null && !cliente.fotoPath.isEmpty()}"
                        th:href="@{/clientes/eliminar-foto/{id}(id=${cliente.id})}"
                        class="btn btn-danger position-absolute top-0 end-0 rounded-circle shadow-sm d-flex align-items-center justify-content-center"
                        style="width: 28px; height: 28px; padding: 0; transform: translate(25%, -25%); border: 2px solid white;"
                        title="Eliminar foto" onclick="return confirm('¿Seguro que quieres eliminar la foto?')">
                        <i class="ph ph-trash" style="font-size: 0.85rem;"></i>
                    </a>
                </div>
                <div class="col">
                    <div class="border rounded-3 p-3 bg-light text-center border-dashed"
                        style="border-style: dashed !important;">
                        <input type="file" name="fotoFile" id="fotoFileInput" class="form-control form-control-sm"
                            accept="image/*" style="opacity: 0; position: absolute; width: 0;">
                        <label for="fotoFileInput" class="btn btn-light-custom btn-sm mb-2" style="cursor: pointer;">
                            <i class="ph ph-upload-simple me-1"></i> Seleccionar Imagen
                        </label>
                        <p class="text-muted small mb-0" id="fileName">Formatos: JPG, PNG, GIF (Máx. 5MB)</p>
                    </div>
                </div>
            </div>

            <hr class="my-5 text-transparent" style="opacity: 0;">

            <div class="d-flex justify-content-end gap-3 pt-3 border-top">
                <a th:href="@{/clientes}" class="btn btn-light-custom btn-custom">Cancelar</a>
                <button type="submit" class="btn btn-save btn-custom px-4">
                    <i class="ph ph-check-circle"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>

    <script>
        const inputFoto = document.getElementById('fotoFileInput');
        const preview = document.getElementById('preview');
        const fileName = document.getElementById('fileName');

        inputFoto.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                fileName.innerHTML = `<span class="text-primary fw-medium">${file.name}</span>`;
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                }
                reader.readAsDataURL(file);
            } else {
                fileName.innerHTML = 'Formatos: JPG, PNG, GIF (Máx. 5MB)';
            }
        });
    </script>
</body>

</html>
