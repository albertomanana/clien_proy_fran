<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${cliente.id == 0 ? 'Nuevo Cliente' : 'Editar Cliente'}">Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="container pb-5">
    <!-- Contenedor principal de la tarjeta del formulario -->
    <div class="main-card" style="max-width: 800px; margin-left: auto; margin-right: auto;">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="fw-bold mb-0" th:text="${cliente.id == 0 ? 'Nuevo Cliente' : 'Editar Cliente'}">Cliente</h2>
            <a th:href="@{/clientes}" class="btn-icon" title="Cerrar">
                <i class="ph ph-x fs-5"></i>
            </a>
        </div>
        <p class="text-muted mb-4 pb-3 border-bottom"
            th:text="${cliente.id == 0 ? 'Añade los detalles del nuevo cliente en el sistema.' : 'Actualiza la información del cliente.'}">
        </p>

        <form th:action="${cliente.id == 0 ? '/clientes/guardar' : '/clientes/actualizar'}" th:object="${cliente}"
            method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}" />

            <!-- Sección de Datos Personales del Cliente -->
            <div class="section-title"><i class="ph ph-user"></i> Datos Personales</div>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej. Juan" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Apellidos</label>
                    <input type="text" th:field="*{apellidos}" class="form-control" placeholder="Ej. Pérez" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tipo de Cliente</label>
                    <select th:field="*{tipoClienteId}" class="form-select" required>
                        <option value="0">Selecciona un tipo</option>
                        <option th:each="tipo : ${tiposCliente}" th:value="${tipo.id}" th:text="${tipo.nombre}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="juan@ejemplo.com"
                        required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono</label>
                    <input type="text" th:field="*{telefono}" class="form-control" placeholder="+34 600 000 000">
                </div>
                <div class="col-12">
                    <label class="form-label">Dirección</label>
                    <input type="text" th:field="*{direccion}" class="form-control" placeholder="Calle Ejemplo, 123">
                </div>
            </div>

            <!-- Sección de Registro de Pagos -->
            <div class="section-title"><i class="ph ph-currency-circle-dollar"></i> Registro de Pagos</div>
            <div class="economic-box">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label d-block text-center">1er Pago</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted" style="backdrop-filter: blur(4px); background: rgba(255,255,255,0.7) !important;">€</span>
                            <input type="number" step="0.01" th:field="*{pago1}"
                                class="form-control border-start-0 ps-0">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label d-block text-center">2do Pago</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted" style="backdrop-filter: blur(4px); background: rgba(255,255,255,0.7) !important;">€</span>
                            <input type="number" step="0.01" th:field="*{pago2}"
                                class="form-control border-start-0 ps-0">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label d-block text-center">3er Pago</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 text-muted" style="backdrop-filter: blur(4px); background: rgba(255,255,255,0.7) !important;">€</span>
                            <input type="number" step="0.01" th:field="*{pago3}"
                                class="form-control border-start-0 ps-0">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label d-block text-center" style="color: var(--primary-color);">Final</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 fw-bold" style="color: var(--primary-color); border-color: var(--primary-color); backdrop-filter: blur(4px); background: rgba(255,255,255,0.8) !important;">€</span>
                            <input type="number" step="0.01" th:field="*{pagoFinal}"
                                class="form-control border-start-0 ps-0 fw-bold" style="color: var(--primary-color); border-color: var(--primary-color);">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sección de Subida y Vista Previa de Fotografía -->
            <div class="section-title"><i class="ph ph-image"></i> Fotografía del Cliente</div>
            <div class="row align-items-center g-4">
                <div class="col-auto position-relative">
                    <img id="preview"
                        th:src="${cliente.fotoPath != null && !cliente.fotoPath.isEmpty() ? '/' + cliente.fotoPath : 'https://ui-avatars.com/api/?name=Foto&background=e2e8f0&color=475569'}"
                        class="preview-img" alt="Vista previa">

                    <!-- Botón para eliminar foto -->
                    <a th:if="${cliente.fotoPath != null && !cliente.fotoPath.isEmpty()}"
                        th:href="@{/clientes/eliminar-foto/{id}(id=${cliente.id})}"
                        class="btn btn-danger position-absolute top-0 end-0 rounded-circle shadow-sm d-flex align-items-center justify-content-center"
                        style="width: 28px; height: 28px; padding: 0; transform: translate(25%, -25%); border: 2px solid white; background: var(--danger-color); z-index: 10;"
                        title="Eliminar foto" onclick="return confirm('¿Seguro que quieres eliminar la foto?')">
                        <i class="ph ph-trash" style="font-size: 0.85rem;"></i>
                    </a>
                </div>
                <div class="col">
                    <div class="border rounded-3 p-3 bg-light text-center"
                        style="border-style: dashed !important; border-color: var(--border-color) !important; background: rgba(255,255,255,0.3) !important;">
                        <input type="file" name="fotoFile" id="fotoFileInput" class="form-control form-control-sm"
                            accept="image/*" style="opacity: 0; position: absolute; width: 0;">
                        <label for="fotoFileInput" class="btn btn-light-custom btn-sm mb-2" style="cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.5rem 1rem;">
                            <i class="ph ph-upload-simple fs-5"></i> Seleccionar Imagen
                        </label>
                        <p class="text-muted small mb-0 fw-medium" id="fileName">Formatos: JPG, PNG, GIF (Máx. 5MB)</p>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-3 pt-4 mt-5 border-top" style="border-color: var(--border-color) !important;">
                <a th:href="@{/clientes}" class="btn btn-light-custom btn-custom">Cancelar</a>
                <button type="submit" class="btn btn-save btn-custom px-4">
                    <i class="ph ph-check-circle fs-5"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>

    <script>
        const inputFoto = document.getElementById('fotoFileInput');
        const preview = document.getElementById('preview');
        const fileName = document.getElementById('fileName');

        inputFoto.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                fileName.innerHTML = `<span class="fw-bold" style="color: var(--primary-color);">${file.name}</span>`;
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    // Add a tiny bounce animation on image load
                    preview.style.animation = 'none';
                    preview.offsetHeight; // trigger reflow
                    preview.style.animation = 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                }
                reader.readAsDataURL(file);
            } else {
                fileName.innerHTML = 'Formatos: JPG, PNG, GIF (Máx. 5MB)';
            }
        });
    </script>
</body>

</html>
