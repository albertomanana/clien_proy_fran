<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="container pb-5">
    <!-- Contenedor principal del listado de clientes -->
    <div class="main-card">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h2 class="fw-bold mb-0">Clientes</h2>
            <a th:href="@{/clientes/nuevo}" class="btn btn-primary-custom btn-custom">
                <i class="ph ph-plus fw-bold"></i> Nuevo Cliente
            </a>
        </div>

        <!-- Filtro de Tipos de Cliente -->
        <div class="filter-container" id="filterContainer">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" th:each="tipo : ${tiposCliente}" 
                    th:data-filter="${tipo.nombre}" 
                    th:text="${tipo.nombre}"></button>
            <button class="filter-btn" data-filter="Sin tipo">Sin tipo</button>
        </div>

        <!-- Tabla responsiva para mostrar la lista de clientes agrupada -->
        <div class="table-responsive">
            <table class="table align-middle" id="clientesTable">
                <thead>
                    <tr>
                        <th width="80">Foto</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Tipo</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Total</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}" class="client-row" th:data-tipo="${cliente.tipoClienteNombre != null ? cliente.tipoClienteNombre : 'Sin tipo'}">
                        <td>
                            <img th:src="${cliente.fotoPath != null && !cliente.fotoPath.isEmpty() ? '/' + cliente.fotoPath : 'https://ui-avatars.com/api/?name=' + cliente.nombre + '+' + cliente.apellidos + '&background=e2e8f0&color=475569'}"
                                class="cliente-foto" alt="Foto">
                        </td>
                        <td th:text="${cliente.nombre}" class="fw-medium text-title">Nombre</td>
                        <td th:text="${cliente.apellidos}">Apellidos</td>
                        <td>
                            <span class="badge rounded-pill text-bg-info text-white" style="background-color: var(--primary-color) !important;"
                                th:text="${cliente.tipoClienteNombre != null ? cliente.tipoClienteNombre : 'Sin tipo'}">
                                Tipo
                            </span>
                        </td>
                        <td th:text="${cliente.email}" class="text-muted">Email</td>
                        <td th:text="${cliente.telefono}">Teléfono</td>
                        <td class="fw-bold text-primary"
                            th:text="${#numbers.formatDecimal(cliente.balanceTotal, 1, 2) + ' €'}">0.00 €</td>
                        <td>
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn-action edit"
                                    title="Editar">
                                    <i class="ph ph-pencil-simple"></i>
                                </a>
                                <a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}" class="btn-action delete"
                                    title="Eliminar" onclick="return confirm('¿Eliminar cliente?')">
                                    <i class="ph ph-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr id="emptyStateRow" th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="8" class="text-center py-5">
                            <i class="ph ph-users fs-1 text-muted mb-3 d-block"></i>
                            <span class="text-muted">No hay clientes registrados.</span>
                        </td>
                    </tr>
                    <tr id="noResultsRow" class="hidden-row">
                        <td colspan="8" class="text-center py-5">
                            <i class="ph ph-magnifying-glass fs-1 text-muted mb-3 d-block"></i>
                            <span class="text-muted">No se encontraron clientes para este filtro.</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script para filtrar dinámicamente -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const filterBtns = document.querySelectorAll('.filter-btn');
            const clientRows = document.querySelectorAll('.client-row');
            const noResultsRow = document.getElementById('noResultsRow');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Update active class
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const filterValue = btn.getAttribute('data-filter');
                    let visibleCount = 0;

                    clientRows.forEach(row => {
                        const rowType = row.getAttribute('data-tipo');
                        
                        if (filterValue === 'all' || rowType === filterValue) {
                            row.classList.remove('hidden-row');
                            // Re-trigger animation
                            row.style.animation = 'none';
                            row.offsetHeight; /* trigger reflow */
                            row.style.animation = null;
                            visibleCount++;
                        } else {
                            row.classList.add('hidden-row');
                        }
                    });

                    if (visibleCount === 0 && clientRows.length > 0) {
                        noResultsRow.classList.remove('hidden-row');
                    } else {
                        noResultsRow.classList.add('hidden-row');
                    }
                });
            });
        });
    </script>
</body>

</html>
